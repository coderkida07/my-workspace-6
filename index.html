<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Snake Game</title><style>body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2)}.game{background:#fff;padding:20px;border-radius:16px;text-align:center;box-shadow:0 15px 40px #0005}h1{color:#333}canvas{background:#07110b;border:2px solid #333;display:block;margin:auto}.buttons{margin:15px}.buttons button{padding:10px 18px;margin:4px;border:0;border-radius:8px;color:#fff;cursor:pointer;font-weight:bold}#start{background:#4caf50}#pause{background:#ff9800}#restart{background:#f44336}.score{font-size:20px;margin:10px}.help{color:#666}</style></head><body><div class="game"><h1>🐍 Snake Game</h1><div class="score">Score: <b id="score">0</b> | Best: <b id="best">0</b></div><canvas id="c" width="400" height="400"></canvas><div class="buttons"><button id="start">▶ Start</button><button id="pause">⏸ Pause</button><button id="restart">↻ Restart</button></div><div id="status">Ready to play</div><p class="help">Arrow Keys / WASD to move · Space to pause</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),sc=document.getElementById('score'),be=document.getElementById('best'),status=document.getElementById('status');let snake,food,dir,next,score,best=+localStorage.snakeBest||0,timer,running=false,paused=false;be.textContent=best;function init(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:0,y:0};next={x:0,y:0};score=0;sc.textContent=0;foodNew();draw();status.textContent='Ready to play'}function foodNew(){do{food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}while(snake.some(a=>a.x==food.x&&a.y==food.y))}function draw(){x.fillStyle='#07110b';x.fillRect(0,0,400,400);x.strokeStyle='#ffffff12';for(let i=0;i<=400;i+=20){x.beginPath();x.moveTo(i,0);x.lineTo(i,400);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(400,i);x.stroke()}snake.forEach((a,i)=>{x.fillStyle=i?'#35b94a':'#7cff6b';x.fillRect(a.x*20+1,a.y*20+1,18,18)});x.fillStyle='#f44336';x.beginPath();x.arc(food.x*20+10,food.y*20+10,7,0,Math.PI*2);x.fill()}function speed(){return Math.max(55,130-score*5)}function startLoop(){clearInterval(timer);timer=setInterval(update,speed())}function start(){running=true;paused=false;status.textContent='Game running';startLoop()}function pause(){if(!running)return;paused=!paused;status.textContent=paused?'Game paused':'Game running'}function over(){running=false;clearInterval(timer);timer=null;status.textContent='Game Over — press Restart'}function update(){if(!running||paused)return;dir={...next};if(!dir.x&&!dir.y)return;let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=20||head.y<0||head.y>=20)return over();let eat=head.x==food.x&&head.y==food.y,body=eat?snake:snake.slice(0,-1);if(body.some(a=>a.x==head.x&&a.y==head.y))return over();snake.unshift(head);if(eat){score++;sc.textContent=score;if(score>best){best=score;be.textContent=best;localStorage.snakeBest=best}foodNew();startLoop()}else snake.pop();draw()}function move(a,b){if(dir.x==-a&&dir.y==-b)return;next={x:a,y:b};if(!running)start()}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' '].includes(k))e.preventDefault();if(k=='arrowup'||k=='w')move(0,-1);else if(k=='arrowdown'||k=='s')move(0,1);else if(k=='arrowleft'||k=='a')move(-1,0);else if(k=='arrowright'||k=='d')move(1,0);else if(k==' ')pause()});start.onclick=start;pause.onclick=pause;restart.onclick=()=>{clearInterval(timer);init();start()};init()</script></body></html>
